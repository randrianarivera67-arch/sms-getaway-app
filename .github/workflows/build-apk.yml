name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet 'tools', installe par defaut, a ete retire des
          # cmdline-tools 16 : l'action echouait avant meme la compilation.
          # Le SDK du runner contient deja ce qu'il faut pour Gradle.
          packages: ''

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
