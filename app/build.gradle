plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 35
    namespace 'mg.smsgateway'

    defaultConfig {
        applicationId "mg.smsgateway"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "2.0.0"
    }

    // Cle de signature FIXE (committee) : toutes les builds ont la MEME signature,
    // donc les mises a jour APK s'installent sans "app non installee".
    signingConfigs {
        matulmada {
            storeFile file('matulmada.keystore')
            storePassword 'matulmada'
            keyAlias 'matulmada'
            keyPassword 'matulmada'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.matulmada
        }
        debug {
            signingConfig signingConfigs.matulmada
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Firebase Cloud Messaging : reveille l'application (et le service
    // d'accessibilite) meme en veille profonde, pour qu'un retrait mis en
    // file par le serveur reparte sans intervention.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}
