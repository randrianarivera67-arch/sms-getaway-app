plugins { id 'com.android.application' }

android {
    compileSdk 35
    namespace 'mg.smsgateway'

    defaultConfig {
        applicationId "mg.smsgateway"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "2.0.0"
    }

    // Cle de signature FIXE (committee) : toutes les builds ont la MEME signature,
    // donc les mises a jour APK s'installent sans "app non installee".
    signingConfigs {
        matulmada {
            storeFile file('matulmada.keystore')
            storePassword 'matulmada'
            keyAlias 'matulmada'
            keyPassword 'matulmada'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.matulmada
        }
        debug {
            signingConfig signingConfigs.matulmada
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}
